[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "ngs-preflight"
dynamic = ["version"]
description = "Pre-submission checks for NGS inputs: target BEDs, sample sheets, reference compatibility and sample identity, with plain-language reports."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Eric Wootton" }]
keywords = ["bioinformatics", "ngs", "quality-control", "genomics", "bed", "sample-sheet", "somalier"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
  "Typing :: Typed",
]
dependencies = [
  "pydantic>=2.5",
  "rich>=13.7",
  "jinja2>=3.1",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.6",
  "mypy>=1.11",
  "types-PyYAML",
  "pre-commit>=3.8",
]

[project.scripts]
preflight = "ngs_preflight.cli:main"

[tool.hatch.version]
path = "src/ngs_preflight/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/ngs_preflight"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "docs", "examples", "scripts", "README.md", "LICENSE", "CHANGELOG.md", "CLAUDE.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "somalier: needs the somalier binary (or PREFLIGHT_SOMALIER_CMD); skipped when unavailable",
]

[tool.coverage.run]
source = ["ngs_preflight"]
branch = false

[tool.coverage.report]
show_missing = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "RUF", "PT"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011", "PT018", "E501"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/ngs_preflight"]
plugins = ["pydantic.mypy"]
